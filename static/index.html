<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LogoTrace</title>
  <base href="/trace/" />
  <link rel="stylesheet" href="static/styles.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1>LogoTrace</h1>
      </div>
    </header>

    <main class="grid">
      <section class="panel input-panel">
        <div
          id="drop"
          class="drop"
          tabindex="0"
          role="button"
          aria-label="Drop, click, or paste an image"
        >
          <div id="drop-empty" class="drop-empty">
            <p class="drop-title">Drop image here</p>
            <p class="drop-sub">or click to browse · paste with <kbd>⌘V</kbd> / <kbd>Ctrl+V</kbd></p>
          </div>
          <img id="preview-in" class="preview-in hidden" alt="Source preview" />
        </div>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />

        <div class="controls">
          <div class="controls-row">
            <div class="seg" id="palette-seg" role="group" aria-label="Color count">
              <button type="button" class="seg-btn active" data-palette="auto">Auto</button>
              <button type="button" class="seg-btn" data-palette="1">1</button>
              <button type="button" class="seg-btn" data-palette="2">2</button>
              <button type="button" class="seg-btn" data-palette="3">3</button>
              <button type="button" class="seg-btn" data-palette="4">4</button>
            </div>
            <button type="button" id="btn-clear" class="btn muted-btn hidden">Clear</button>
            <button type="button" id="btn-run" class="btn primary" disabled>Vectorize</button>
          </div>
          <p id="status" class="status" role="status">Auto smart-detects. Pick a number for exact ink count.</p>
        </div>
      </section>

      <section class="panel out-panel">
        <div id="out-empty" class="out-empty">
          <p>PDF preview appears here</p>
        </div>
        <div id="out-stage" class="out-stage hidden" tabindex="0" aria-label="PDF preview">
          <canvas id="pdf-canvas"></canvas>
        </div>
        <div class="out-foot">
          <div id="zoom-bar" class="zoom-bar hidden" role="group" aria-label="Zoom">
            <button type="button" id="zoom-out" class="btn icon" title="Zoom out" aria-label="Zoom out">−</button>
            <button type="button" id="zoom-fit" class="btn ghost tiny" title="Fit">Fit</button>
            <button type="button" id="zoom-in" class="btn icon" title="Zoom in" aria-label="Zoom in">+</button>
            <span id="zoom-label" class="zoom-label">100%</span>
          </div>
          <a id="btn-download" class="btn primary hidden" download="logotrace.pdf">Download PDF</a>
        </div>
      </section>
    </main>
  </div>
  <script src="static/app.js?v=2" defer></script>
</body>
</html>
